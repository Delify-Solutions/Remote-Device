# Cấu hình chung cho scan_devices.sh / start_wda_farm.sh / stop_wda_farm.sh
# (file này được `source` từ bash, giữ cú pháp KEY=value, không có khoảng trắng quanh dấu =)

# Bundle ID của WDA runner đã cài trên iPhone (= PRODUCT_BUNDLE_IDENTIFIER lúc build + ".xctrunner").
# Đổi khi ký lại bằng tài khoản trả phí.
WDA_BUNDLE_ID=com.delify.WebDriverAgent.xctrunner

# Gói WDA đã build sẵn (xcodebuild build-for-testing). Dùng để tự cài lên máy chưa có WDA.
WDA_APP=.wda-build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app

# Port trên Mac: máy thứ i (bắt đầu từ 1) dùng WDA_BASE_PORT+i và MJPEG_BASE_PORT+i
#   máy 1 -> 8101 / 9101, máy 2 -> 8102 / 9102, ...
WDA_BASE_PORT=8100
MJPEG_BASE_PORT=9100

# Port bên trong iPhone. Mỗi iPhone là một máy riêng nên tất cả dùng chung 8100/9100,
# iproxy map port Mac (8101, 8102, ...) về đúng port này trên từng máy.
DEVICE_WDA_PORT=8100
DEVICE_MJPEG_PORT=9100

# Số giây chờ WDA trả lời /status trước khi báo lỗi
HEALTH_TIMEOUT=${HEALTH_TIMEOUT:-90}
